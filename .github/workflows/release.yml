name: Release

# Build Windows and Linux installers and publish them as one GitHub release.
#
#   * pushing a tag v<version> builds both platforms and creates the release;
#   * workflow_dispatch builds the artifacts without publishing, or publishes
#     a release when a version input is given and "build only" is unchecked.
#
# The version packaged is always the workspace version in Cargo.toml; a tag or
# version input that does not match it fails the run instead of shipping a
# mismatched manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (must match workspace.package.version in Cargo.toml). Leave empty to build artifacts only."
        required: false
        type: string
      build_only:
        description: "Build and upload the artifacts without creating a release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Strawberry Perl and Inno Setup
        shell: pwsh
        run: |
          choco install strawberryperl innosetup -y --no-progress
          # The vendored OpenSSL the catalogue needs is built with Perl; put
          # Strawberry's perl on the PATH of the following steps.
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build and package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/ForbiddenLibrarySetup-*.exe
            dist/update.zip
            dist/update.json

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang lld perl make \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            curl zip lzip file

      - name: Build and package
        run: scripts/package.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/ForbiddenLibrary-*-linux-x86_64.tar.gz
            dist/update-linux.zip
            dist/update-linux.json

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_only == false && inputs.version != '') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$file_version" ]; then
            echo "::error::Cargo.toml has no workspace version"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          if [ "$version" != "$file_version" ]; then
            echo "::error::Cargo.toml says $file_version but the release is $version; bump workspace.package.version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the expected assets are present
        run: |
          set -euo pipefail
          ls -l release-assets
          for pattern in \
            'ForbiddenLibrarySetup-*.exe' \
            'update.zip' \
            'update.json' \
            'ForbiddenLibrary-*-linux-x86_64.tar.gz' \
            'update-linux.zip' \
            'update-linux.json'
          do
            if ! compgen -G "release-assets/$pattern" > /dev/null; then
              echo "::error::release asset $pattern is missing"
              exit 1
            fi
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Windows and Linux builds of Forbidden Library ${VERSION}.

          ## Install

          ### Windows

          Download \`ForbiddenLibrarySetup-${VERSION}.exe\` and run it. It installs per user and needs no administrator rights.

          ### Linux

          Download \`ForbiddenLibrary-${VERSION}-linux-x86_64.tar.gz\`, unpack it and run the installer:

          \`\`\`sh
          tar -xzf ForbiddenLibrary-${VERSION}-linux-x86_64.tar.gz
          cd ForbiddenLibrary-${VERSION}-linux-x86_64
          ./install.sh
          \`\`\`

          That installs the program per user in \`~/.local/share/forbidden-library/app\`, adds a launcher on \`PATH\` and a menu entry. No root rights are needed.

          ## Updates

          Installed copies on both platforms update themselves on launch from the release assets: Windows uses \`update.json\`/\`update.zip\`, Linux uses \`update-linux.json\`/\`update-linux.zip\`. Set \`FORBIDDEN_LIBRARY_NO_UPDATE=1\` to turn that off.

          Your library is never touched by installs or updates. It lives in \`%LOCALAPPDATA%\\Forbidden Library\` on Windows and in \`~/.local/share/Forbidden Library\` on Linux; \`FORBIDDEN_LIBRARY_DATA_DIR\` overrides it.

          Release files: the Windows setup, the Linux tarball, and the two self-update archives with their manifests.
          EOF

          target_args=()
          if [ "$REF_TYPE" != "tag" ]; then
            target_args=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" \
            --title "Forbidden Library $VERSION" \
            --notes-file release-notes.md \
            "${target_args[@]}" \
            release-assets/*
