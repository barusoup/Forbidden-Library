<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#151619;color:#f5f5f5}[hidden]{display:none!important}body{max-width:420px;margin:14vh auto;padding:24px;text-align:center}
.hint{color:#9aa0ab;font-size:14px;margin:0 0 32px}
.row{display:flex;justify-content:center;align-items:center;gap:20px}
button{display:grid;place-items:center;width:76px;height:76px;padding:0;border-radius:50%;border:1px solid #454750;background:#282a30;color:inherit;cursor:pointer}
button svg{width:30px;height:30px}
button.primary{background:#eceef3;color:#18191c;border-color:#eceef3}
button.small{width:40px;height:40px;border-radius:50%}button.small svg{width:18px;height:18px}
button:disabled{opacity:.35;cursor:default}
#picked{margin-top:28px;color:#b9bdc6;font-size:15px;gap:12px}
progress{display:block;width:100%;margin-top:28px;accent-color:#eceef3}
#status{display:flex;justify-content:center;align-items:center;gap:8px;min-height:24px;margin-top:16px;font-size:15px}
#status svg{width:18px;height:18px}
input[type=file]{display:none}
</style>
<p class="hint">Keep this upload menu open during transfer.</p>
<div class="row">
  <button id="add" aria-label="Add files" title="Add files"></button>
  <button id="addPhotos" aria-label="Add photos and videos" title="Add photos and videos"></button>
  <button id="send" class="primary" aria-label="Upload" title="Upload" disabled></button>
</div>
<div id="picked" class="row" hidden><span id="summary"></span><button id="clear" class="small" aria-label="Clear selection" title="Clear selection"></button></div>
<progress id="progress" value="0" max="1" hidden></progress>
<p id="status" role="status" aria-live="polite"></p>
<input id="files" type="file" multiple>
<input id="photos" type="file" accept="image/*,video/*" multiple>
<script>
'use strict';
const PATHS={
 fileUp:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 images:'<path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"/><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"/><circle cx="13" cy="7" r="1" fill="currentColor"/><rect x="8" y="2" width="14" height="14" rx="2"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'
};
const svg=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);
const add=$('add'),addPhotos=$('addPhotos'),send=$('send'),clear=$('clear'),input=$('files'),photos=$('photos'),picked=$('picked'),summary=$('summary'),progress=$('progress'),status=$('status');
const LIMIT_COUNT=500,LIMIT_FILE=2*1024**3,LIMIT_TOTAL=10*1024**3;
let selected=[],busy=false,finished=false;
const total=files=>files.reduce((n,f)=>n+f.size,0);
const say=(name,text='')=>{status.innerHTML=name?svg(name):'';status.append(text);};
const invalid=files=>files.length>LIMIT_COUNT||files.some(f=>!f.size||f.size>LIMIT_FILE)||total(files)>LIMIT_TOTAL;
function render(){
 picked.hidden=!selected.length;
 summary.textContent=selected.length===1?'1 file selected':`${selected.length} files selected`;
 add.disabled=addPhotos.disabled=busy||finished||!token;
 clear.disabled=busy||finished;
 send.disabled=busy||finished||!token||!selected.length;
}
if(!token){say('alert','Scan the QR code again.');}
add.innerHTML=svg('fileUp');addPhotos.innerHTML=svg('images');clear.innerHTML=svg('x');send.innerHTML=svg('check');
add.onclick=()=>input.click();
addPhotos.onclick=()=>photos.click();
// Each picker open adds to the selection, so pickers that return one file at a time still build up a full list.
const addFrom=picker=>{
 for(const file of picker.files){
  if(!selected.some(s=>s.name===file.name&&s.size===file.size&&s.lastModified===file.lastModified))selected.push(file);
 }
 picker.value='';
 say();render();
};
input.onchange=()=>addFrom(input);
photos.onchange=()=>addFrom(photos);
clear.onclick=()=>{selected=[];say();render();};
send.onclick=async()=>{
 const files=selected;
 if(!files.length||busy||finished)return;
 if(invalid(files)){say('alert','Too many files, too large, or empty.');return;}
 busy=true;render();
 progress.hidden=false;progress.max=files.length;progress.value=0;
 let done=0;
 try{
  for(const file of files){
   say(null,`${done} / ${files.length}`);
   const response=await fetch('/upload',{method:'PUT',headers:{Authorization:'Bearer '+token,'X-File-Name':encodeURIComponent(file.name)},body:file,credentials:'omit',redirect:'error'});
   if(!response.ok)throw Error(response.status===413?`${file.name} is too large.`:`Could not send ${file.name} (error ${response.status}). Scan again if the dialog closed.`);
   progress.value=++done;
  }
  const response=await fetch('/finish',{method:'POST',headers:{Authorization:'Bearer '+token},credentials:'omit',redirect:'error'});
  if(!response.ok)throw Error('Could not finish. Scan again.');
  finished=true;selected=[];
  say('check','Done');
 }catch(error){
  say('alert',error.message||`Stopped at ${done} / ${files.length}`);
 }finally{
  busy=false;render();
  if(finished)progress.hidden=true;
 }
};
addEventListener('beforeunload',event=>{if(busy){event.preventDefault();event.returnValue='';}});
render();
</script>
