[features]
default = ["console"]
console = []
# Draws the video bar's controls bare, without the black outline. Off by
# default, so the plain variant is left out of the compiled app.
plain-controls = []

[package]
name = "forbidden-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forbidden Library — a safe, fast home for photos and videos"

[[bin]]
name = "forbidden-library"
path = "src/main.rs"

[dependencies]
archive-core = { path = "../archive-core" }
base64 = "0.22"
axum = "0.8"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
sha2 = "0.10"
subtle = "2"
percent-encoding = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
cpal = "0.16"
dirs = "6"
getrandom = "0.3"
dream = { git = "https://github.com/barusoup/Dream", rev = "92903b88e387c2ebdaa036ffe6ec07aa81598090" }
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
winit = "0.30"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "png"] }

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
