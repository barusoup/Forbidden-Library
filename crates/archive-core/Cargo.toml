[package]
name = "archive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forbidden Library's storage, import, metadata and media optimization engine"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
blake3 = "1.5"
chacha20poly1305 = "0.10"
chrono = "0.4"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
kamadak-exif = "0.6"
oxipng = { version = "9", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
